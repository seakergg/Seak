name: Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java (JDK 21) beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Webes fájlok előkészítése (www mappa)
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/ 2>/dev/null || true

      - name: Függőségek telepítése és Android projekt generálása
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Debug APK fordítása (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK feltöltése letölthető csomagként (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: seakk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release létrehozása (ha v* taggel fut)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
