name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Webes fájlok előkészítése
        run: |
          mkdir -p www
          cp index.html manifest.json icon-192.png icon-512.png www/

      - name: Függőségek
        run: npm install

      - name: Android projekt létrehozása
        run: npx cap add android

      - name: OAuth visszatérő hivatkozás (hu.seakk.app://oauth)
        run: |
          sed -i 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="hu.seakk.app" android:host="oauth"/></intent-filter></activity>#' android/app/src/main/AndroidManifest.xml
          grep -c 'hu.seakk.app' android/app/src/main/AndroidManifest.xml

      - name: Ikonok cseréje a logóra
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          for e in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n a f <<< "$e"
            convert icon-512.png -resize ${a}x${a} $R/mipmap-$n/ic_launcher.png
            convert icon-512.png -resize ${a}x${a} $R/mipmap-$n/ic_launcher_round.png
            convert icon-512.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Szinkronizálás
        run: npx cap sync android

      - name: APK építése
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: seakk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release (v* címkénél)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
